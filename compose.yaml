services:
  web:
    build: .
    image: wexashelf:0.8.0-php
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3141}:80"
    environment:
      WEXA_STORAGE_PATH: /var/www/html/storage
      WEXA_SETUP_KEY: ${WEXA_SETUP_KEY:?Set a unique setup key of at least 24 characters in .env}
    volumes:
      - shelf-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/api/health') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wexashelf}
      MARIADB_USER: ${DB_USER:-wexashelf}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set a unique database password in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set a separate database root password in .env}
    volumes:
      - shelf-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  shelf-storage:
  shelf-db:
